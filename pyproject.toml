[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trivax"
version = "0.1.0.dev0"
description = "Experimental resolutive adaptive edge control runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Marcelo Roldão Matos"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
