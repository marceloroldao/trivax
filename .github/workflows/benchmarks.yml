name: benchmarks

on:
  push:
    branches: [main, v0.2-dev]
    paths:
      - "benchmarks/**"
      - "src/trivax/**"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/trivax/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:

jobs:
  benchmark-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run V5 VOI sweep
        env:
          TRIVAX_BENCHMARK_OUTPUT: benchmark-results
        run: |
          mkdir -p benchmark-results
          python benchmarks/voi_sweep.py | tee benchmark-results/voi_sweep.txt
      - name: Run V4 vs V5 benchmark
        run: |
          python benchmarks/value_of_information.py | tee benchmark-results/value_of_information.txt
      - name: Run composite adversarial benchmark
        run: |
          python benchmarks/composite_adversarial.py > benchmark-results/composite_adversarial.json
      - name: Run OOD holdout benchmark
        run: |
          python benchmarks/holdout_generalization.py | tee benchmark-results/holdout_generalization.csv
      - name: Run V5 ablation benchmark
        run: |
          python benchmarks/ablation_v5.py > benchmark-results/ablation_v5.json
      - name: Run V6 hybrid benchmark
        run: |
          python benchmarks/runtime_v6_hybrid.py | tee benchmark-results/runtime_v6_hybrid.csv
      - name: Run Core-RC comparison
        run: |
          python benchmarks/core_rc_comparison.py | tee benchmark-results/core_rc_comparison.csv
      - name: Run temporal-credit advantage map
        run: |
          python benchmarks/temporal_advantage_map.py | tee benchmark-results/temporal_advantage_map.csv
      - name: Run online regime selector benchmark
        run: |
          python benchmarks/regime_selector_comparison.py | tee benchmark-results/regime_selector_comparison.csv
      - name: Run v0.2 oracle regret benchmark
        run: |
          python benchmarks/oracle_regret_selector.py | tee benchmark-results/oracle_regret_selector.csv
      - name: Run v0.2 selector ablation
        run: |
          python benchmarks/regime_selector_ablation_v02.py | tee benchmark-results/regime_selector_ablation_v02.csv
      - name: Run v0.2 selector calibration
        run: |
          python benchmarks/selector_calibration_v02.py | tee benchmark-results/selector_calibration_v02.csv
      - name: Run v0.2 blind selector holdout
        run: |
          python benchmarks/selector_blind_holdout_v02.py | tee benchmark-results/selector_blind_holdout_v02.csv
      - name: Run v0.2 worst-regime robustness
        run: |
          python benchmarks/worst_regime_v02.py | tee benchmark-results/worst_regime_v02.csv
      - name: Run v0.2 classical-control reference comparison
        run: |
          python benchmarks/classic_market_baselines_v02.py | tee benchmark-results/classic_market_baselines_v02.csv
      - name: Run v0.2 information-matched black-box comparison
        run: |
          python benchmarks/information_matched_blackbox_v02.py | tee benchmark-results/information_matched_blackbox_v02.csv
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: trivax-benchmark-results
          path: benchmark-results/
          retention-days: 30
